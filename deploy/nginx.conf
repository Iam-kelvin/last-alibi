server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        font/ttf
        image/svg+xml
        text/css
        text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser must revalidate the service worker and manifest on deploy.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires -1;
        try_files $uri =404;
    }

    # Expo fingerprints these files, so they are safe to cache for a year.
    location ^~ /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Expo Router emits static .html routes. The final fallback is required for
    # generated case URLs such as /case/<id> and other client-side navigation.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
